<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Deadline-Radar</title>
</head>
  <body>
    <p>Do it before it goes to land of the dead ^^</p>

    <hr>
    <h1>Dashboard Statistics</h1>
    <div class="js-statistics statistics"> Less goo </div>

    <hr>
    <h1>Tasks to complete</h1>
    <select class="js-filter-tasks filter-tasks">
        <option value="" selected disabled>🗂️ Filter Tasks</option>
        <option value="1">Incomplete Tasks</option>
        <option value="2">OverDue Tasks</option>
        <option value="3">Completed Tasks</option>
        <option value="4">Future Tasks</option>
        <option value="5">Today's Tasks</option>
    </select>
    <div class="todo-input-grid">
        <input type="text" placeholder="Title"
            class="js-name-input name-input">
        <input type="date"
            class="js-due-date-input due-date-input">
        <input type="number" placeholder="Estimated hours"
            class="js-estimatedHours-input estimatedHours-input">
        
        <select class="js-priority-input priority-input" >
            <option value="" selected disabled>--Select Priority--</option>
            <option value="1">General</option>
            <option value="2">Important</option>
            <option value="3">Urgent</option>
        </select>
        <button class="add-todo-button js-add-todo-button">Add</button>
    </div>

    <div class="js-todo-list todo-grid"></div>

    <hr>
    <h1>Completed Tasks</h1>
    <div class="js-completed-list completed-list"></div>

    <script src="script.js"></script>
  </body>
</html>
