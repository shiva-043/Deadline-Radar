<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Deadline-Radar</title>
</head>
  <body>
    <p class="heading">Deadline-Radar</p>
    <p class="tagline">Keeps you back on the line before it's a deadline</p>

    <hr>
    <p class="dashboard-title"> Dashboard </p>
    <div class="js-statistics statistics"> </div>

    <hr>

    <section class="add-task-section">
        <h2>Add a New Task</h2>
        <p class="section-description">Keep track of what needs to get done.</p>

        <div class="todo-input-grid">
            <input type="text" placeholder="Task title"
                class="js-name-input name-input">

            <input type="date"
                class="js-due-date-input due-date-input">

            <input type="number" placeholder="Hours"
                class="js-estimatedHours-input estimatedHours-input">

            <select class="js-priority-input priority-input">
                <option value="" selected disabled>Priority</option>
                <option value="1">General</option>
                <option value="2">Important</option>
                <option value="3">Urgent</option>
            </select>

            <button class="add-todo-button js-add-todo-button">+ Add Task</button>
        </div>
    </section>

    <select class="js-filter-tasks filter-tasks">
        <option value="" selected disabled>🗂️ Filter Tasks</option>
        <option value="1">Incomplete Tasks</option>
        <option value="2">OverDue Tasks</option>
        <option value="3">Completed Tasks</option>
        <option value="4">Future Tasks</option>
        <option value="5">Today's Tasks</option>
    </select>

    <div class="js-todo-list todo-grid"></div>



    <script src="script.js"></script>
  </body>
</html>
